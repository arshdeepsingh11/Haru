<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="372" viewBox="0 0 1280 372" role="img" aria-label="HARU at a glance">
  <defs>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e56ff"/><stop offset=".55" stop-color="#2bc8e8"/><stop offset="1" stop-color="#ff6fb5"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5fc"/></linearGradient>
  </defs>
  <style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.n{font-size:40px;font-weight:700;letter-spacing:-1px}.l{font-size:15px;fill:#12142b;font-weight:600}.s{font-size:13px;fill:#969cb4}
  .bar{animation:g 1.6s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}@keyframes g{from{transform:scaleX(0)}}</style>
  <rect width="1280" height="372" rx="28" fill="url(#bg)" stroke="#12142b" stroke-opacity=".06"/>
  <text x="48" y="58" class="t" font-size="20" font-weight="700" fill="#12142b">HARU at a glance</text>
  <text x="232" y="58" class="t s">counted from the codebase, Oct 2026</text>
  <g class="t">
    <g transform="translate(48 90)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="url(#aur)">47</text><text x="22" y="80" class="l">AI tools</text><text x="22" y="98" class="s">validated, undoable writes</text><rect class="bar" x="22" y="108" width="232" height="3" rx="1.5" fill="url(#aur)"/></g>
    <g transform="translate(348 90)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="url(#aur)">15</text><text x="22" y="80" class="l">dashboard cards</text><text x="22" y="98" class="s">placed by Haru, per person</text><rect class="bar" x="22" y="108" width="160" height="3" rx="1.5" fill="url(#aur)"/></g>
    <g transform="translate(648 90)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="url(#aur)">4</text><text x="22" y="80" class="l">pay calendars</text><text x="22" y="98" class="s">weekly to custom 15th &amp; 30th</text><rect class="bar" x="22" y="108" width="110" height="3" rx="1.5" fill="url(#aur)"/></g>
    <g transform="translate(948 90)"><rect width="284" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="url(#aur)">69</text><text x="22" y="80" class="l">automated tests</text><text x="22" y="98" class="s">incl. real Postgres end to end</text><rect class="bar" x="22" y="108" width="240" height="3" rx="1.5" fill="url(#aur)"/></g>
    <g transform="translate(48 226)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="#12142b">60 min</text><text x="22" y="80" class="l">shift reminder lead</text><text x="22" y="98" class="s">with "I'm going" buttons</text></g>
    <g transform="translate(348 226)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="#12142b">4</text><text x="22" y="80" class="l">Gemini models</text><text x="22" y="98" class="s">automatic fallback when busy</text></g>
    <g transform="translate(648 226)"><rect width="276" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="#12142b">¢</text><text x="22" y="80" class="l">integer-cent money</text><text x="22" y="98" class="s">no floating-point balances</text></g>
    <g transform="translate(948 226)"><rect width="284" height="118" rx="20" fill="#fff" stroke="#12142b" stroke-opacity=".06"/><text x="22" y="56" class="n" fill="#12142b">25</text><text x="22" y="80" class="l">Postgres tables</text><text x="22" y="98" class="s">row-level isolation per user</text></g>
  </g>
</svg>
